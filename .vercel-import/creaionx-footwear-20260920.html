function home(){return `<section class="hero"><video src="${heroVideo}" muted autoplay loop playsinline preload="auto"></video><div class="hero-fallback"></div><div class="hero-vignette"></div><div class="hero-content"><div class="eyebrow liquid">THE NEW SEASON / 2026</div><h1>Walk <em>differently.</em></h1><p>Contemporary women’s footwear designed to move with every version of you.</p><div class="hero-ctas"><a class="btn white" href="#/collection/New%20In">SHOP NEW ARRIVALS ${icon('arrow')}</a><a class="btn glass" href="#/collection/Heels">EXPLORE COLLECTION</a></div></div><div class="scroll-note">SCROLL TO DISCOVER ${icon('chev')}</div></section><section class="section"><div class="section-head"><div><span class="kicker">JUST LANDED</span><h2>New <em>arrivals.</em></h2></div><a href="#/collection/New%20In">VIEW ALL ${icon('arrow')}</a></div>${grid(products.slice(0,4))}</section><section class="category-section"><div class="section-head compact"><div><span class="kicker">FIND YOUR PAIR</span><h2>Shop by <em>mood.</em></h2></div></div><div class="category-grid">${cats.map(([n,l,img])=>`<a href="#/collection/${n}" class="category-card"><img src="${img}" alt="${n}"><div class="category-shade"></div><div class="category-copy"><span>${l}</span><h3>${n}</h3><div>EXPLORE ${icon('arrow')}</div></div></a>`).join('')}</div></section><section class="editorial"><div class="editorial-img"><img src="https://images.unsplash.com/photo-1512601381045-1e7e77c616d1?auto=format&fit=crop&w=1600&q=90" alt="Evening edit"><div class="play liquid-circle">▶</div></div><div class="editorial-copy"><span class="kicker">THE EVENING EDIT</span><h2>Made for <em>after dark.</em></h2><p>Sculptural silhouettes, sharp lines and luminous details. Designed for entrances, exits and everything in between.</p><a class="btn white" href="#/collection/Heels">DISCOVER THE EDIT ${icon('arrow')}</a></div></section><section class="section dark-section"><div class="section-head"><div><span class="kicker">MOST WANTED</span><h2>The pairs everyone <em>keeps.</em></h2></div></div>${grid(products.slice(4,8))}</section><section class="manifesto"><div class="manifesto-card liquid"><span class="kicker">CREAIONX FOOT WEAR</span><h2>Designed to be worn.<br><em>Built to be remembered.</em></h2><p>Footwear with presence—made for everyday confidence, special nights and the spaces in between.</p></div></section>${newsletter()}`}
function collection(name){let list=name==='Wishlist'?products.filter(p=>state.wishlist.includes(p.id)):['New In','Sale'].includes(name)?products:products.filter(p=>p.category===name);if(name==='Sale')list=products.filter(p=>p.compareAt);if(state.sort==='low')list=[...list].sort((a,b)=>a.price-b.price);if(state.sort==='high')list=[...list].sort((a,b)=>b.price-a.price);return `<main class="collection-page"><section class="collection-hero"><div><span class="kicker">CREAIONX EDIT</span><h1>${name==='Wishlist'?'Your ':''}<em>${name}</em></h1><p>${name==='Wishlist'?'The pairs you saved for later.':'A focused edit of silhouettes made to move beautifully.'}</p></div></section><div class="collection-toolbar"><button data-action="filter">${icon('filter')} FILTER</button><span>${list.length} PRODUCTS</span><select id="sort"><option value="featured" ${state.sort==='featured'?'selected':''}>SORT: FEATURED</option><option value="low" ${state.sort==='low'?'selected':''}>PRICE: LOW TO HIGH</option><option value="high" ${state.sort==='high'?'selected':''}>PRICE: HIGH TO LOW</option></select></div>${state.filterOpen?`<div class="filter-panel liquid"><div><b>SIZE</b><span>36</span><span>37</span><span>38</span><span>39</span><span>40</span><span>41</span></div><div><b>COLOR</b><span>BLACK</span><span>NUDE</span><span>IVORY</span><span>SILVER</span></div><div><b>PRICE</b><span>UNDER 5K</span><span>5K–7K</span><span>7K+</span></div></div>`:''}<section class="section collection-grid-wrap">${list.length?grid(list):'<div class="empty-state">Nothing here yet.</div>'}</section></main>`}
function productPage(id){const p=products.find(x=>x.id===id)||products[0];state.selectedSize=null;const liked=state.wishlist.includes(p.id);return `<main class="product-page"><div class="breadcrumbs"><a href="#/">HOME</a><span>/</span><a href="#/collection/${p.category}">${p.category.toUpperCase()}</a><span>/</span><b>${p.name.toUpperCase()}</b></div><section class="product-layout"><div class="gallery"><div class="thumbs"><button class="on" data-main-img="${p.image}"><img src="${p.image}" alt="${p.name}"></button><button data-main-img="${p.image2}"><img src="${p.image2}" alt="${p.name} alternate"></button></div><div class="main-product-img"><img id="mainProductImage" src="${p.image}" alt="${p.name}">${p.badge?`<span class="badge liquid">${p.badge}</span>`:''}</div></div><aside class="product-info"><span class="kicker">${p.category.toUpperCase()} / ${p.color.toUpperCase()}</span><h1>${p.name}</h1><p class="sub">${p.subtitle}</p><div class="rating"><span>${icon('star')}${icon('star')}${icon('star')}${icon('star')}${icon('star')}</span><b>4.9</b><small>18 REVIEWS</small></div><div class="product-price">${p.compareAt?`<s>${money(p.compareAt)}</s>`:''}<strong>${money(p.price)}</strong></div><div class="divider"></div><div class="choice"><div class="choice-head"><b>COLOR</b><span>${p.color}</span></div><div class="swatch-row"><button class="swatch black on"></button><button class="swatch nude"></button><button class="swatch ivory"></button></div></div><div class="choice"><div class="choice-head"><b>SELECT SIZE</b><a href="#">SIZE GUIDE</a></div><div class="sizes">${p.sizes.map(s=>`<button data-size="${s}">${s}</button>`).join('')}</div><div class="size-warning" id="sizeWarning"></div></div><button class="add-btn" data-add="${p.id}">ADD TO BAG ${icon('bag')}</button><button class="wish-btn ${liked?'active':''}" data-wish="${p.id}">${icon('heart')} ${liked?'SAVED TO WISHLIST':'ADD TO WISHLIST'}</button><div class="benefits"><div>${icon('truck')}<span><b>COMPLIMENTARY DELIVERY</b><small>On qualifying orders</small></span></div><div>${icon('rotate')}<span><b>EASY EXCHANGE</b><small>Simple size exchanges</small></span></div><div>${icon('shield')}<span><b>SECURE CHECKOUT</b><small>Protected payment flow</small></span></div></div>${accordion('DESCRIPTION','A polished silhouette with a clean, feminine line. Designed to pair with occasionwear, tailoring and elevated everyday looks.')}${accordion('MATERIAL & CARE','Premium synthetic upper with cushioned lining and a structured outsole. Wipe clean with a soft dry cloth.')}${accordion('DELIVERY & EXCHANGES','Delivery and exchange rules will be connected to the real store backend later.')}</aside></section><section class="section recommendations"><div class="section-head"><div><span class="kicker">COMPLETE THE EDIT</span><h2>You may also <em>like.</em></h2></div></div>${grid(products.filter(x=>x.id!==p.id).slice(0,4))}</section></main>`}
const accordion=(t,c)=>`<div class="accordion"><button data-accordion><span>${t}</span>${icon('plus')}</button><p hidden>${c}</p></div>`;
function overlays(){const sub=state.cart.reduce((s,x)=>s+x.price*x.qty,0);return `<div class="overlay ${state.cartOpen||state.menuOpen?'show':''}" data-action="close"></div><aside class="drawer cart-drawer ${state.cartOpen?'open':''}"><div class="drawer-head"><div><span class="kicker">CREAIONX</span><h3>YOUR BAG</h3></div><button data-action="close">${icon('x')}</button></div><div class="drawer-body">${state.cart.length?state.cart.map((x,i)=>`<div class="cart-item"><img src="${x.image}" alt="${x.name}"><div><h4>${x.name}</h4><p>${x.subtitle}</p><small>SIZE ${x.size}</small><div class="qty"><button data-qty="${i},-1">${icon('minus')}</button><span>${x.qty}</span><button data-qty="${i},1">${icon('plus')}</button></div></div><div class="cart-price"><button data-remove="${i}">${icon('trash')}</button><strong>${money(x.price*x.qty)}</strong></div></div>`).join(''):`<div class="empty-bag">${icon('bag')}<h4>Your bag is empty.</h4><p>Find a pair worth making room for.</p><a href="#/collection/New%20In" data-action="close">SHOP NEW ARRIVALS</a></div>`}</div>${state.cart.length?`<div class="drawer-foot"><div><span>SUBTOTAL</span><strong>${money(sub)}</strong></div><p>Shipping and discounts calculated at checkout.</p><button>CHECKOUT ${icon('arrow')}</button><a href="#/" data-action="close">CONTINUE SHOPPING</a></div>`:''}</aside><aside class="drawer menu-drawer ${state.menuOpen?'open':''}"><div class="drawer-head">${brand()}<button data-action="close">${icon('x')}</button></div><div class="mobile-links">${['New In','Heels','Flats','Sandals','Formal','Sale'].map(x=>`<a href="#/collection/${encodeURIComponent(x)}" data-action="close">${x}${icon('chev')}</a>`).join('')}<a href="#/wishlist" data-action="close">Wishlist ${icon('heart')}</a></div><div class="menu-footer">INSTAGRAM · TIKTOK · CONTACT</div></aside><div class="search-overlay ${state.searchOpen?'open':''}"><button class="search-close" data-action="close">${icon('x')}</button><div class="search-inner"><span class="kicker">SEARCH CREAIONX FOOT WEAR</span><h2>What are you <em>looking for?</em></h2><div class="search-box liquid">${icon('search')}<input id="searchInput" placeholder="Search heels, flats, sandals..."><button id="clearSearch">${icon('x')}</button></div><div id="searchBody"><div class="popular"><span>POPULAR NOW</span><a href="#/collection/Heels" data-action="close">Heels</a><a href="#/collection/Flats" data-action="close">Black Flats</a><a href="#/collection/Formal" data-action="close">Occasion</a><a href="#/collection/New%20In" data-action="close">New Arrivals</a></div></div></div></div>`}
function render(){const r=route();let main=r==='/'?home():r==='/wishlist'?collection('Wishlist'):r.startsWith('/collection/')?collection(r.split('/')[2]):r.startsWith('/product/')?productPage(r.split('/')[2]):home();document.getElementById('app').innerHTML=`${navbar()}<div class="route-fade">${main}</div>${footer()}${overlays()}`;bind();window.scrollTo({top:0,behavior:'instant'});}
function bind(){document.querySelectorAll('[data-action]').forEach(el=>el.onclick=e=>{const a=el.dataset.action;if(a==='cart')state.cartOpen=true;if(a==='search')state.searchOpen=true;if(a==='menu')state.menuOpen=true;if(a==='close'){state.cartOpen=false;state.searchOpen=false;state.menuOpen=false}if(a==='filter')state.filterOpen=!state.filterOpen;render()});document.querySelectorAll('[data-wish]').forEach(el=>el.onclick=e=>{e.preventDefault();e.stopPropagation();const id=el.dataset.wish;state.wishlist=state.wishlist.includes(id)?state.wishlist.filter(x=>x!==id):[...state.wishlist,id];save();render()});document.querySelectorAll('[data-size]').forEach(el=>el.onclick=()=>{state.selectedSize=Number(el.dataset.size);document.querySelectorAll('[data-size]').forEach(x=>x.classList.toggle('on',x===el));document.getElementById('sizeWarning').textContent=''});document.querySelectorAll('[data-add]').forEach(el=>el.onclick=()=>{if(!state.selectedSize){document.getElementById('sizeWarning').textContent='Please select your size.';return}const p=products.find(x=>x.id===el.dataset.add);const i=state.cart.findIndex(x=>x.id===p.id&&x.size===state.selectedSize);if(i>=0)state.cart[i].qty++;else state.cart.push({...p,size:state.selectedSize,qty:1});state.cartOpen=true;save();render()});document.querySelectorAll('[data-main-img]').forEach(el=>el.onclick=()=>{document.getElementById('mainProductImage').src=el.dataset.mainImg;document.querySelectorAll('[data-main-img]').forEach(x=>x.classList.toggle('on',x===el))});document.querySelectorAll('[data-accordion]').forEach(el=>el.onclick=()=>{const p=el.nextElementSibling;p.hidden=!p.hidden;el.lastElementChild.outerHTML=p.hidden?icon('plus'):icon('minus')});document.querySelectorAll('[data-qty]').forEach(el=>el.onclick=()=>{const [i,d]=el.dataset.qty.split(',').map(Number);state.cart[i].qty=Math.max(1,state.cart[i].qty+d);save();render()});document.querySelectorAll('[data-remove]').forEach(el=>el.onclick=()=>{state.cart.splice(Number(el.dataset.remove),1);save();render()});const sort=document.getElementById('sort');if(sort)sort.onchange=()=>{state.sort=sort.value;render()};const form=document.getElementById('newsletter');if(form)form.onsubmit=e=>{e.preventDefault();const b=form.querySelector('button');b.textContent='YOU’RE ON THE LIST';};const search=document.getElementById('searchInput');if(search){search.focus();search.oninput=()=>{const q=search.value.trim().toLowerCase(),body=document.getElementById('searchBody');if(!q){body.innerHTML='<div class="popular"><span>POPULAR NOW</span><a href="#/collection/Heels" data-action="close">Heels</a><a href="#/collection/Flats" data-action="close">Black Flats</a><a href="#/collection/Formal" data-action="close">Occasion</a><a href="#/collection/New%20In" data-action="close">New Arrivals</a></div>';return bindSearchLinks()}const res=products.filter(p=>(p.name+' '+p.subtitle+' '+p.category).toLowerCase().includes(q));body.innerHTML=`<div class="search-results">${res.slice(0,6).map(p=>`<a href="#/product/${p.id}" data-action="close"><img src="${p.image}"><div><b>${p.name}</b><span>${p.subtitle}</span></div><strong>${money(p.price)}</strong></a>`).join('')}</div>`;bindSearchLinks()};document.getElementById('clearSearch').onclick=()=>{search.value='';search.dispatchEvent(new Event('input'))}}}
function bindSearchLinks(){document.querySelectorAll('#searchBody [data-action="close"]').forEach(el=>el.onclick=()=>{state.searchOpen=false})}
window.addEventListener('hashchange',()=>{state.searchOpen=false;state.cartOpen=false;state.menuOpen=false;render()});render();

</script>
</body>
</html>
